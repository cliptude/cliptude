<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Publish kit</title>
<style>
/*@BASE_CSS@*/
</style>
</head>
<body>
<main class="app" aria-labelledby="title">
  <div class="head">
    <h1 id="title">Publish kit</h1>
    <span class="sub" id="facts"></span>
  </div>
  <div id="content" class="list"><div class="status" role="status">Loading the publish kit…</div></div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*@BRIDGE_JS@*/
/*@VIEWS_JS@*/
(function () {
  "use strict";
  var content = document.getElementById("content");
  Cliptude.connect({
    name: "cliptude-publish-kit",
    onResult: function (data) {
      var err = UI.errorText(data);
      if (err) { UI.status(content, err, "error"); return; }
      // The video stage opens first when there is one: current = kit.video && kit.video.url ? -1 : 0 (views.js).
      var kit = data.project && !data.publish_metadata ? data.project : data;
      document.getElementById("title").textContent = kit.title ? "Publish kit · " + kit.title : "Publish kit";
      Views.publishKit(content, kit);
    },
    onCancelled: function () { UI.status(content, "Cancelled."); }
  }).catch(function () { UI.status(content, "This view could not connect to the chat.", "error"); });
})();
</script>
</body>
</html>
