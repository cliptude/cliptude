<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Choose an avatar</title>
<style>
/*@BASE_CSS@*/
.badge-photo { position: absolute; left: 6px; top: 6px; }
.create-card .thumb { font-size: 40px; color: var(--accent); }
.panel { display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: var(--border-radius-md);
  background: var(--color-background-secondary); border: 1px solid var(--color-border-primary); }
.panel h2 { font-size: var(--font-text-md-size); margin: 0; }
.panel label { display: flex; flex-direction: column; gap: 4px; font-size: var(--font-text-sm-size); color: var(--color-text-secondary); }
.panel textarea, .panel input[type="text"] {
  font: inherit; font-size: var(--font-text-sm-size); color: var(--color-text-primary);
  background: var(--color-background-primary); border: 1px solid var(--color-border-primary);
  border-radius: var(--border-radius-sm); padding: 8px 10px; }
.panel textarea { min-height: 60px; resize: vertical; }
.review dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: var(--font-text-sm-size); }
.review dt { color: var(--color-text-secondary); }
.review dd { margin: 0; }
.photo-preview { max-width: 220px; aspect-ratio: 16 / 9; object-fit: cover; border-radius: var(--border-radius-sm); }
</style>
</head>
<body>
<main class="app" aria-labelledby="title">
  <div class="head">
    <h1 id="title">Choose a presenter</h1>
    <span class="sub" id="count"></span>
  </div>
  <div class="toolbar">
    <label class="sr-only" for="filter">Filter avatars by name</label>
    <input type="search" id="filter" placeholder="Filter by name" autocomplete="off">
  </div>
  <div id="create-panel" class="panel" hidden></div>
  <div id="content" class="list"><div class="status" role="status">Loading avatars…</div></div>
  <div id="more"></div>
  <div class="selection" id="selection" hidden>
    <span class="what" id="selected-text"></span>
    <button class="primary" id="use" type="button">Use this avatar</button>
  </div>
</main>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/*@BRIDGE_JS@*/
(function () {
  "use strict";
  var h = UI.h;
  var CREATE_PAGE = "https://cliptude.com/videos/avatars/create/";
  var GROUPS = [["mine", "Yours"], ["builtin", "Built-in"], ["public", "Public"]];
  var SECTION_LABEL = { mine: "Yours", builtin: "Built-in", public: "Public" };
  var avatars = [];
  var total = 0;
  var input = {};
  var selected = null;
  var content = document.getElementById("content");

  function isPhoto(a) { return a.section === "mine" || a.section === "builtin"; }

  function visible(section) {
    var q = document.getElementById("filter").value.trim().toLowerCase();
    return avatars.filter(function (a) {
      if (a.section !== section) return false;
      return !q || String(a.name || "").toLowerCase().indexOf(q) >= 0 || String(a.id) === q;
    });
  }

  function select(a) {
    if (a.status && a.status !== "ready") { UI.toast("This avatar is still being made. It can be picked once it is ready."); return; }
    selected = a;
    render();
    document.getElementById("selection").hidden = false;
    document.getElementById("selected-text").textContent =
      "“" + a.name + "” · id " + a.id + (a.gender && a.gender !== "unknown" ? " · " + a.gender : "");
  }

  function card(a) {
    var thumb = UI.img(a.preview_url || a.thumbnail_url || "", "", UI.initials(a.name));
    if (isPhoto(a)) thumb.appendChild(h("span", { class: "chip info badge-photo" }, ["Photo avatar"]));
    var meta = [SECTION_LABEL[a.section] || a.section];
    if (a.gender && a.gender !== "unknown") meta.push(a.gender);
    if (a.status && a.status !== "ready") meta.push(a.status === "pending" ? "Being made" : a.status);
    return h("button", {
      type: "button", class: "card", role: "listitem", "aria-pressed": String(!!selected && selected.id === a.id),
      "aria-label": a.name + ", " + meta.join(", ") + ", id " + a.id,
      onclick: function () { select(a); }
    }, [
      thumb,
      h("span", { class: "body" }, [
        h("span", { class: "name" }, [a.name || "Unnamed"]),
        h("span", { class: "chips" }, meta.map(function (m) { return h("span", { class: "chip" }, [m]); })
          .concat(a.favorite ? [h("span", { class: "chip", "aria-label": "favorite" }, ["★"])] : [])),
        h("span", { class: "muted" }, ["id " + a.id])
      ])
    ]);
  }

  function createCard() {
    return h("button", { type: "button", class: "card create-card", role: "listitem", onclick: openCreate,
      "aria-label": "Create a new avatar" }, [
      h("span", { class: "thumb" }, [h("span", { "aria-hidden": "true" }, ["+"])]),
      h("span", { class: "body" }, [h("span", { class: "name" }, ["Create a new avatar"]),
        h("span", { class: "muted" }, ["From a 16:9 photo or a description · 55 credits"])])
    ]);
  }

  function render() {
    document.getElementById("count").textContent = total ? avatars.length + " of " + total + " shown" : "";
    UI.clear(content);
    var any = false;
    GROUPS.forEach(function (g) {
      var rows = visible(g[0]);
      if (!rows.length && g[0] !== "mine") return;
      any = any || rows.length > 0;
      var grid = h("div", { class: "grid", role: "list", "aria-label": g[1] });
      if (g[0] === "mine") grid.appendChild(createCard());
      rows.forEach(function (a) { grid.appendChild(card(a)); });
      content.appendChild(h("section", { class: "list" }, [h("h2", { class: "section-title" }, [g[1]]), grid]));
    });
    if (!any && document.getElementById("filter").value) content.appendChild(h("div", { class: "status" }, ["No avatar matches that filter."]));
    renderMore();
  }

  function renderMore() {
    var box = UI.clear(document.getElementById("more"));
    if (avatars.length >= total || !Cliptude.canCallTools()) return;
    box.appendChild(h("button", { type: "button", onclick: loadMore }, ["Show more avatars"]));
  }

  function merge(rows) {
    var seen = {};
    avatars.forEach(function (a) { seen[a.id] = true; });
    (rows || []).forEach(function (a) { if (!seen[a.id]) { avatars.push(a); seen[a.id] = true; } });
  }

  function loadMore(event) {
    var button = event.currentTarget;
    button.disabled = true;
    var args = {};
    Object.keys(input || {}).forEach(function (k) { args[k] = input[k]; });
    args.offset = (input.offset || 0) + avatars.length;
    args.limit = input.limit || 50;
    Cliptude.callTool("list_avatars", args).then(function (data) {
      merge(data && data.results);
      if (data && data.count) total = data.count;
      render();
    }).catch(function () { button.disabled = false; UI.toast("Could not load more avatars."); });
  }

  /* ---- Create a new avatar (55 credits, after the user approves the price) ---- */
  function openCreate() {
    if (!Cliptude.canCallTools()) {
      Cliptude.openLink(CREATE_PAGE).then(function () { UI.toast("Opened Create an avatar on cliptude.com."); })
        .catch(function () { UI.toast("Open " + CREATE_PAGE + " to create an avatar."); });
      return;
    }
    var panel = document.getElementById("create-panel");
    panel.hidden = false;
    var name = h("input", { type: "text", id: "av-name", maxlength: "100", placeholder: "e.g. Studio me" });
    var gender = h("select", { id: "av-gender" }, [h("option", { value: "" }, ["Detect from photo"]),
      h("option", { value: "female" }, ["Female"]), h("option", { value: "male" }, ["Male"])]);
    var file = h("input", { type: "file", id: "av-photo", accept: "image/jpeg,image/png,image/webp" });
    var desc = h("textarea", { id: "av-desc", maxlength: "1000", placeholder: "Or describe the presenter: a woman in her 30s with short dark hair, navy blazer, bright studio" });
    var preview = h("span", {});
    var go = h("button", { type: "button", class: "primary" }, ["Continue"]);
    var cancel = h("button", { type: "button", onclick: function () { panel.hidden = true; } }, ["Cancel"]);
    var out = h("div", { class: "list" });
    var photo = null;
    file.addEventListener("change", function () {
      photo = null; UI.clear(preview);
      var f = file.files[0];
      if (!f) return;
      if (f.size > 10 * 1024 * 1024) { UI.toast("The photo is over 10 MB."); file.value = ""; return; }
      var reader = new FileReader();
      reader.onload = function () {
        var url = String(reader.result);
        var img = h("img", { class: "photo-preview", src: url, alt: "Selected photo" });
        img.onload = function () {
          var ratio = img.naturalWidth / img.naturalHeight;
          if (Math.abs(ratio - 16 / 9) > 0.08) UI.toast("Avatars are 16:9: use a landscape 16:9 photo (this one is " + img.naturalWidth + "×" + img.naturalHeight + ").");
          Cliptude.reportSize();
        };
        preview.appendChild(img);
        photo = { name: f.name, base64: url.split(",")[1] };
      };
      reader.readAsDataURL(f);
    });
    UI.clear(panel).appendChild(h("h2", {}, ["Create a new avatar"]));
    panel.appendChild(h("span", { class: "sub" }, ["Private to your account. Use a landscape 16:9 photo of yourself, or of someone who agreed to it, or describe the presenter. HeyGen takes a few minutes to finish it."]));
    panel.appendChild(h("div", { class: "toolbar" }, [h("label", { for: "av-name" }, ["Avatar name", name]), h("label", { for: "av-gender" }, ["Gender", gender])]));
    panel.appendChild(h("label", { for: "av-photo" }, ["Photo (JPG, PNG or WEBP, 16:9)", file]));
    panel.appendChild(preview);
    panel.appendChild(h("label", { for: "av-desc" }, ["Description (when there is no photo)", desc]));
    panel.appendChild(h("div", { class: "toolbar" }, [go, cancel]));
    panel.appendChild(out);
    go.addEventListener("click", function () {
      if (!name.value.trim()) { UI.toast("Give the avatar a name."); return; }
      if (!photo && !desc.value.trim()) { UI.toast("Add a photo or a description."); return; }
      if (!photo && !gender.value) { UI.toast("Choose male or female for an avatar made from a description."); return; }
      var args = { display_name: name.value.trim() };
      if (gender.value) args.gender = gender.value;
      if (photo) { args.photo_base64 = photo.base64; args.photo_file_name = photo.name; } else args.appearance = desc.value.trim();
      go.disabled = true;
      UI.status(out, "Checking the price…");
      Cliptude.callTool("create_avatar", args).then(function (res) { go.disabled = false; handleCreate(res, args, out); })
        .catch(function () { go.disabled = false; UI.status(out, "Could not reach Cliptude.", "error"); });
    });
    Cliptude.reportSize();
  }

  function handleCreate(res, args, out) {
    if (res && res.status === 428 && res.detail && res.detail.review) { showReview(res.detail, args, out); return; }
    var err = UI.errorText(res);
    if (err) {
      var detail = (res && res.detail) || {};
      UI.status(out, detail.code === "insufficient_credits"
        ? "Not enough credits: " + (detail.credits_required || 55) + " needed, " + (detail.credits_available || 0) + " available."
        : err, "error");
      return;
    }
    var a = res.avatar || {};
    a.status = a.status || "pending";
    avatars.unshift(a);
    document.getElementById("create-panel").hidden = true;
    render();
    UI.toast("Avatar requested. It appears under Yours once HeyGen finishes it.");
  }

  function showReview(detail, args, out) {
    var review = detail.review;
    var credits = review.credits || {};
    var dl = h("dl", {});
    (review.settings || []).forEach(function (s) { dl.appendChild(h("dt", {}, [s.label])); dl.appendChild(h("dd", {}, [String(s.value)])); });
    dl.appendChild(h("dt", {}, ["Price"]));
    dl.appendChild(h("dd", {}, [credits.credits_required + " credits (you have " + credits.credits_available + ")"]));
    var confirm = h("button", { type: "button", class: "primary", disabled: credits.enough_credits === false },
      ["Create for " + credits.credits_required + " credits"]);
    confirm.addEventListener("click", function () {
      confirm.disabled = true; confirm.textContent = "Creating…";
      var again = {}; Object.keys(args).forEach(function (k) { again[k] = args[k]; });
      again.review_token = detail.review_token;
      Cliptude.callTool("create_avatar", again).then(function (res) { handleCreate(res, args, out); })
        .catch(function () { UI.status(out, "Could not reach Cliptude.", "error"); });
    });
    UI.clear(out).appendChild(h("div", { class: "panel review", role: "group", "aria-label": "Review" }, [
      h("strong", {}, ["Review before creating"]), dl,
      h("ul", { class: "sub" }, (review.warnings || []).map(function (w) { return h("li", {}, [w]); })),
      credits.enough_credits === false ? h("span", { class: "status error" }, ["Not enough credits. Top up on cliptude.com first."]) : null,
      h("div", { class: "toolbar" }, [confirm])
    ]));
    Cliptude.reportSize();
    confirm.scrollIntoView({ block: "nearest" });
  }

  document.getElementById("filter").addEventListener("input", render);
  document.getElementById("use").addEventListener("click", function () {
    if (!selected) return;
    UI.choose(
      "Use the avatar “" + selected.name + "” (avatar_profile_id " + selected.id + ") as the presenter.",
      { avatar_profile_id: selected.id, avatar_name: selected.name }
    );
  });

  Cliptude.connect({
    name: "cliptude-avatar-picker",
    onInput: function (args) { input = args || {}; },
    onResult: function (data) {
      var err = UI.errorText(data);
      if (err) { UI.status(content, err, "error"); return; }
      avatars = (data.results || []).slice();
      total = data.count || avatars.length;
      render();
      // The user's own avatars may sit past the first page of a mixed list: fetch them so Yours is complete.
      if (!input.section && Cliptude.canCallTools()) {
        Cliptude.callTool("list_avatars", { section: "mine", limit: 100 }).then(function (mine) {
          merge(mine && mine.results);
          render();
        }).catch(function () {});
      }
    },
    onCancelled: function () { UI.status(content, "The avatar list was cancelled."); }
  }).catch(function () { UI.status(content, "This view could not connect to the chat.", "error"); });
})();
</script>
</body>
</html>
